<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Svetlana | Official Access</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --tg-blue: #0088cc;
            --accent: #ff0055;
            --gold: #ffb800;
            --dark-overlay: rgba(0, 0, 0, 0.85);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #000;
            font-family: 'Manrope', sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Интерактивный фон */
        .bg-container {
            position: fixed;
            top: -5%; left: -5%; width: 110%; height: 110%;
            z-index: -1;
            background: url('https://i.postimg.cc/c4X6kPby/d063b8c76a294fe685b189ff9849abab.jpg') center/cover no-repeat;
            filter: blur(15px) brightness(0.4);
            transition: transform 0.1s ease-out; /* Для параллакса */
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(0deg, #000 10%, transparent 100%),
                        radial-gradient(circle at top right, rgba(255,0,85,0.15), transparent);
        }

        .main {
            max-width: 450px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        /* Системный Header */
        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .avatar-wrap { position: relative; }
        .avatar {
            width: 60px; height: 60px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            padding: 2px;
            object-fit: cover;
        }

        .badge {
            position: absolute; bottom: 0; right: 0;
            width: 14px; height: 14px;
            background: #00ff66;
            border: 2px solid #000;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff66;
        }

        .info h2 { font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
        .info p { font-size: 13px; color: var(--accent); font-weight: 600; letter-spacing: 0.5px; }

        /* Текстовый блок */
        .hero h1 { font-size: 36px; font-weight: 900; line-height: 1; margin-bottom: 12px; }
        .hero h1 span { color: var(--accent); }
        .hero p { font-size: 16px; color: #aaa; margin-bottom: 25px; line-height: 1.4; }

        /* Реалистичные плитки */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .tile {
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            background: #111;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .tile img {
            width: 100%; height: 100%; object-fit: cover;
            filter: blur(12px) brightness(0.5);
            transform: scale(1.1);
        }

        .tile::after {
            content: '🔒';
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            background: rgba(0,0,0,0.2);
        }

        /* Кнопки в стиле Premium App */
        .btns { display: flex; flex-direction: column; gap: 14px; }

        .btn {
            width: 100%;
            height: 64px;
            border-radius: 20px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.2s cubic-bezier(0.2, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            font-weight: 800;
            font-size: 17px;
            text-transform: uppercase;
            box-shadow: 0 15px 35px rgba(255, 0, 85, 0.35);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            color: #fff;
        }

        .btn-secondary b { font-size: 16px; color: var(--gold); }
        .btn-secondary span { font-size: 11px; opacity: 0.6; font-weight: 600; margin-top: 2px; }

        .btn-flat {
            height: 40px;
            font-size: 13px;
            color: #666;
            font-weight: 600;
        }

        /* Системное уведомление (iOS style) */
        .notification {
            position: fixed;
            top: -100px; left: 10px; right: 10px;
            background: rgba(25, 25, 25, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 15px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            transition: 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .notification.active { top: 20px; }

        .notif-icon {
            width: 35px; height: 35px;
            background: var(--accent);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 18px;
        }

        .notif-body b { display: block; font-size: 14px; margin-bottom: 2px; }
        .notif-body p { font-size: 13px; color: #ccc; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .btn-primary { animation: pulse 3s infinite ease-in-out; }
    </style>
</head>
<body>

<div class="bg-container" id="parallax-bg"></div>
<div class="overlay"></div>

<div class="notification" id="push">
    <div class="notif-icon">🔥</div>
    <div class="notif-body">
        <b id="push-title">Новый участник!</b>
        <p id="push-text">Александр только что вошел в приват.</p>
    </div>
</div>

<div class="main">
    <div class="header">
        <div class="avatar-wrap">
            <img src="https://i.postimg.cc/WzJ1qrtv/1439531113-984653832.jpg" class="avatar" alt="Svetlana">
            <div class="badge"></div>
        </div>
        <div class="info">
            <h2>Svetlana 🗸</h2>
            <p id="live-status">Записывает кружок...</p>
        </div>
    </div>

    <div class="hero">
        <h1>ТВОЙ <span>VIP</span> ДОСТУП</h1>
        <p>Архив, который не пропустит цензура. <br>Только для своих. 🤫</p>
    </div>

    <div class="preview-grid">
        <div class="tile"><img src="https://i.postimg.cc/WzJ1qrtv/1439531113-984653832.jpg"></div>
        <div class="tile"><img src="https://i.postimg.cc/mrX9QYZB/IMG-20260201-221756-995.jpg"></div>
        <div class="tile"><img src="https://i.postimg.cc/MK2QbKwM/IMG-20260201-221719-024.jpg"></div>
        <div class="tile"><img src="https://i.postimg.cc/CKQZZwJn/IMG-20260201-221451-538.jpg"></div>
    </div>

    <div class="btns">
        <a href="https://t.me/+JP-STmmmSH1mZThi" class="btn btn-primary">
            ПРИНЯТЬ ПРИГЛАШЕНИЕ ⚡
        </a>

        <a href="https://new.donatepay.ru/@Svetlana_1993" class="btn btn-secondary" target="_blank">
            <b>ЛИЧНЫЙ ЧАТ ✦</b>
            <span>Донат от 500₽ — общаемся лично</span>
        </a>

        <a href="https://t.me/lucky_bear_wins" class="btn btn-flat" target="_blank">
            Забрать ежедневный бонус 🎰
        </a>
    </div>
</div>

<script>
    // 1. ИИ-Статус (имитация жизни)
    const statusLabel = document.getElementById('live-status');
    const statuses = ['Записывает кружок...', 'Выбирает фото...', 'В сети', 'Отвечает в ЛС...'];
    
    setInterval(() => {
        statusLabel.style.opacity = '0';
        setTimeout(() => {
            statusLabel.innerText = statuses[Math.floor(Math.random() * statuses.length)];
            statusLabel.style.opacity = '1';
        }, 500);
    }, 6000);

    // 2. Параллакс эффект для реализма
    document.addEventListener('mousemove', (e) => {
        const bg = document.getElementById('parallax-bg');
        const x = (window.innerWidth / 2 - e.pageX) / 50;
        const y = (window.innerHeight / 2 - e.pageY) / 50;
        bg.style.transform = `scale(1.1) translate(${x}px, ${y}px)`;
    });

    // 3. Системные уведомления (Social Proof)
    const push = document.getElementById('push');
    const pushTitle = document.getElementById('push-title');
    const pushText = document.getElementById('push-text');
    
    const names = ['Сергей', 'Mike_Vip', 'Артур', 'Dmitry', 'Ivan_99', 'Alexey', 'Kostya'];
    const actions = [
        {t: 'Новый донат! 💖', m: 'отправил 1000₽ в поддержку'},
        {t: 'Участник вошел! 🔥', m: 'получил доступ к архиву'},
        {t: 'Личное сообщение! 💬', m: 'Светлана ответила на донат'}
    ];

    function triggerPush() {
        const name = names[Math.floor(Math.random() * names.length)];
        const act = actions[Math.floor(Math.random() * actions.length)];
        
        pushTitle.innerText = act.t;
        pushText.innerText = `${name} ${act.m}`;
        
        push.classList.add('active');
        setTimeout(() => push.classList.remove('active'), 4500);
    }

    // Первый пуш через 4 сек, далее каждые 12-20 сек
    setTimeout(() => {
        triggerPush();
        setInterval(triggerPush, Math.floor(Math.random() * 8000) + 12000);
    }, 4000);

    // 4. Имитация вибрации при нажатии (Haptic Feedback)
    document.querySelectorAll('.btn').forEach(btn => {
        btn.addEventListener('click', () => {
            if (window.navigator.vibrate) window.navigator.vibrate(10);
        });
    });
</script>

</body>
</html>
