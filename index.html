  <style>
    :root {
      --primary: #ff0055;
      --gold: #ffd700;
      --bg: #000000;
      --glass: rgba(30,30,35,0.4);
    }

    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',system-ui,sans-serif; -webkit-tap-highlight-color:transparent; }

    body {
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 25% 25%, rgba(255,215,0,0.025) 0%, transparent 60%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.065'/%3E%3C/svg%3E");
    }

    .tg-header {
      position: fixed; top:0; left:0; right:0; height:48px;
      background: rgba(0,0,0,0.75); backdrop-filter: blur(12px);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 16px; font-weight:600; font-size:16px; z-index:100;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }

    .online-dot { width:9px; height:9px; background:#34c759; border-radius:50%; box-shadow:0 0 10px #34c75988; animation:blink 2.4s infinite; }

    .bg-layer {
      position:fixed; inset:0;
      background:url('https://i.postimg.cc/c4X6kPby/d063b8c76a294fe685b189ff9849abab.jpg') center/cover no-repeat;
      filter:brightness(0.38) contrast(1.12); z-index:-2;
    }

    .gradient-overlay {
      position:fixed; inset:0;
      background:linear-gradient(to bottom, transparent 28%, #000 65%); z-index:-1;
    }

    .wrapper { padding:64px 20px 60px; max-width:460px; margin:0 auto; position:relative; z-index:10; }

    h1 {
      font-family:'Playfair Display',serif; font-size:3.4rem; font-weight:800;
      line-height:0.94; margin-bottom:20px; text-transform:uppercase; letter-spacing:-0.8px;
    }
    h1 span { color:var(--primary); }

    .urgency {
      font-size:15px; font-weight:700; color:#ffeb3b; text-align:center;
      margin:12px 0 24px; text-shadow:0 2px 10px rgba(0,0,0,0.8);
    }

    .countdown {
      font-size:19px; font-weight:800; color:var(--gold);
      text-shadow:0 0 15px rgba(255,215,0,0.5); letter-spacing:1.5px;
      text-align:center; margin:16px 0 32px;
    }

    .grid {
      display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:24px 0 40px;
    }

    .item {
      aspect-ratio:1; border-radius:14px; overflow:hidden; position:relative;
      border:1px solid rgba(255,215,0,0.12); transition:all .4s ease;
    }

    .item:hover { transform:scale(1.04); border-color:var(--gold); box-shadow:0 0 22px rgba(255,215,0,0.45); }

    .item img {
      width:100%; height:100%; object-fit:cover;
      filter:blur(7px) brightness(0.85); transition:all .5s ease;
    }
    .item:hover img { filter:blur(0) brightness(1); }

    .lock {
      position:absolute; inset:0; display:grid; place-items:center;
      font-size:32px; background:rgba(0,0,0,0.45);
    }

    .cta {
      display:block; width:100%; padding:19px 20px; border-radius:20px;
      text-align:center; text-decoration:none; margin-bottom:16px;
      font-weight:800; transition:all .28s ease; position:relative; overflow:hidden;
    }

    .cta-main {
      background:linear-gradient(135deg, var(--primary), #d60044);
      color:#fff; box-shadow:0 12px 32px rgba(255,0,85,0.48);
      animation:breathe 4.5s infinite ease-in-out;
    }

    .cta-main:hover { transform:translateY(-2px); box-shadow:0 16px 40px rgba(255,0,85,0.6); }

    .cta-gold {
      background:var(--glass); backdrop-filter:blur(16px);
      border:1px solid rgba(255,215,0,0.3); color:var(--gold);
    }

    .cta-gold:hover { background:rgba(50,50,60,0.55); border-color:var(--gold); }

    .shine::after {
      content:''; position:absolute; top:-60%; left:-120%;
      width:70%; height:220%; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent);
      transform:skewX(-20deg); animation:shine 6s infinite;
    }

    @keyframes shine { 0%{left:-120%} 25%{left:140%} 100%{left:140%} }
    @keyframes breathe { 0%,100%{box-shadow:0 12px 32px rgba(255,0,85,0.48)} 50%{box-shadow:0 16px 44px rgba(255,0,85,0.65)} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .places { font-size:15px; font-weight:800; margin-top:8px; }

    @media (max-width:480px) {
      h1 { font-size:3rem; }
      .wrapper { padding:60px 16px 56px; }
    }
  </style>
</head>
<body>

<div class="bg-layer"></div>
<div class="gradient-overlay"></div>

<div class="tg-header">

  <div style="display:flex;align-items:center;gap:10px;">

</div>

<div class="wrapper">

  <h1 id="title">ВХОД ТОЛЬКО<br>ДЛЯ <span>СВОИХ</span></h1>

  <div class="urgency" id="urgency">Свежий архив без цензуры • Бесплатно для первых сегодня</div>

  <div class="countdown" id="countdown">АКЦИЯ ЗАКАНЧИВАЕТСЯ ЧЕРЕЗ: 01:14:37</div>

  <div class="grid">
    <div class="item"><img loading="lazy" src="https://i.postimg.cc/WzJ1qrtv/1439531113-984653832.jpg" alt=""><div class="lock">🔒</div></div>
    <div class="item"><img loading="lazy" src="https://i.postimg.cc/mrX9QYZB/IMG-20260201-221756-995.jpg" alt=""><div class="lock">🔒</div></div>
    <div class="item"><img loading="lazy" src="https://i.postimg.cc/MK2QbKwM/IMG-20260201-221719-024.jpg" alt=""><div class="lock">🔒</div></div>
    <div class="item"><img loading="lazy" src="https://i.postimg.cc/CKQZZwJn/IMG-20260201-221451-538.jpg" alt=""><div class="lock">🔒</div></div>
  </div>

  <a href="https://t.me/+JP-STmmmSH1mZThi" class="cta cta-main shine" target="_blank" rel="noopener">
    <div style="font-size:19px;">СМОТРЕТЬ БЕЗ ЦЕНЗУРЫ 🔥</div>
    <div class="places" id="places">ОСТАЛОСЬ 10 БЕСПЛАТНЫХ МЕСТ</div>

    <div style="font-size:17px;">МОЙ БОНУС 5000₽ 🎁</div>

<script>
'use strict';

const translations = {
  ru: {
    title: "ВХОД ТОЛЬКО<br>ДЛЯ <span>СВОИХ</span>",
    urgency: "Свежий архив без цензуры • Бесплатно для первых сегодня",
    placesStart: 10
  },
  en: { /* аналогично, если нужно */ }
};

let lang = 'ru';
let t = translations[lang];

let viewers = 114;
let places = parseInt(localStorage.getItem('places'), 10) || t.placesStart;
let startTime = parseInt(localStorage.getItem('startTime'), 10);
if (!startTime) { startTime = Date.now(); localStorage.setItem('startTime', startTime); }

const DURATION = 75 * 60 * 1000; // 75 минут

const els = {
  viewers: document.getElementById('viewers'),
  title: document.getElementById('title'),
  urgency: document.getElementById('urgency'),
  countdown: document.getElementById('countdown'),
  places: document.getElementById('places')
};

function updatePlaces() {
  els.places.textContent = places > 3 ? `ОСТАЛОСЬ ${places} БЕСПЛАТНЫХ МЕСТ` : places === 1 ? "ПОСЛЕДНЕЕ МЕСТО! ЖМИ СЕЙЧАС" : `ОСТАЛОСЬ ${places} МЕСТА!`;
  els.places.style.color = places <= 2 ? "#ff4444" : places <= 4 ? "#ffaa00" : "#ffeb3b";
}

function updateCountdown() {
  const remaining = Math.max(0, DURATION - (Date.now() - startTime));
  if (remaining <= 0) { els.countdown.textContent = "АКЦИЯ ЗАВЕРШЕНА"; return; }
  const h = Math.floor(remaining / 3600000);
  const m = Math.floor((remaining % 3600000) / 60000);
  const s = Math.floor((remaining % 60000) / 1000);
  els.countdown.textContent = `АКЦИЯ ЗАКАНЧИВАЕТСЯ ЧЕРЕЗ: \( {String(h).padStart(2,'0')}: \){String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function updateViewers() {
  viewers = Math.max(105, Math.min(178, viewers + (Math.floor(Math.random()*5)-2)));
  els.viewers.textContent = viewers;
}

function decreasePlaces() {
  if (places > 1) { places--; localStorage.setItem('places', places); updatePlaces(); }
}

// init
els.title.innerHTML = t.title;
els.urgency.textContent = t.urgency;
updateCountdown(); updatePlaces();

setInterval(updateCountdown, 980);
setInterval(updateViewers, 6500);

let decreaseTimer = setTimeout(function run() {
  decreasePlaces();
  decreaseTimer = setTimeout(run, 65000 + Math.random()*45000);
}, 65000 + Math.random()*45000);
</script>

</html>
