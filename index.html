<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вход для своих</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            /* Чтобы контент всегда был внизу, как на скрине */
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
        }

        /* Жестко фиксированный фон, который 100% будет работать */
        .bg-image {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://i.postimg.cc/c4X6kPby/d063b8c76a294fe685b189ff9849abab.jpg');
            background-size: cover;
            background-position: center 20%;
            filter: brightness(0.45);
            z-index: -1;
        }

        /* Верхняя панель (как на скрине) */
        .top-bar {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 800;
            z-index: 10;
        }

        .online-count {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px; height: 8px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
        }

        .privacy {
            letter-spacing: 1px;
        }

        /* Основной блок с контентом */
        .content-box {
            padding: 20px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Локация */
        .location {
            color: #00ff66;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.5px;
        }

        /* Главный заголовок */
        h1 {
            font-size: 44px;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 span { color: #ff0066; }

        /* Описание */
        .desc {
            font-size: 16px;
            line-height: 1.4;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Галерея превью */
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .gallery-item {
            aspect-ratio: 1;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .gallery-item img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: blur(8px);
            transform: scale(1.1); /* Чтобы края не светились после блюра */
        }

        .lock {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
        }

        /* Кнопки из твоего скрина */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .btn-pink {
            background-color: #ff0080;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 0, 128, 0.4);
        }

        .btn-dark {
            background-color: rgba(30, 30, 30, 0.8);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .btn-yellow {
            background-color: #ffc107;
            color: #000000;
            margin-bottom: 0;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.3);
        }
    </style>
</head>
<body>

<div class="bg-image"></div>

<div class="top-bar">
    <div class="online-count">
        <div class="dot"></div>
        115
    </div>
    <div class="privacy">PRIVACY: ON</div>
</div>

<div class="content-box">
    <div class="location">
        📍 ТЫ РЯДОМ СО МНОЙ?
    </div>

    <h1>ВХОД ТОЛЬКО<br>ДЛЯ <span>СВОИХ</span> 18+</h1>

    <div class="desc">
        Залила сюда весь архив без цензуры.<br>
        <b>Бесплатно для первых 100 человек.</b>
    </div>

    <div class="gallery">
        <div class="gallery-item">
            <img src="https://i.postimg.cc/WzJ1qrtv/1439531113-984653832.jpg" alt="1">
            <div class="lock">🔒</div>
        </div>
        <div class="gallery-item">
            <img src="https://i.postimg.cc/mrX9QYZB/IMG-20260201-221756-995.jpg" alt="2">
            <div class="lock">🔒</div>
        </div>
        <div class="gallery-item">
            <img src="https://i.postimg.cc/MK2QbKwM/IMG-20260201-221719-024.jpg" alt="3">
            <div class="lock">🔒</div>
        </div>
        <div class="gallery-item">
            <img src="https://i.postimg.cc/CKQZZwJn/IMG-20260201-221451-538.jpg" alt="4">
            <div class="lock">🔒</div>
        </div>
    </div>

    <a href="https://t.me/+JP-STmmmSH1mZThi" class="btn btn-pink">
        ► ВРЫВАЙСЯ В ПРИВАТ 🔥
    </a>
    
    <a href="https://new.donatepay.ru/@Svetlana_1993" class="btn btn-dark" target="_blank">
        ПОДДЕРЖАТЬ МЕНЯ 💖
    </a>
    
    <a href="https://t.me/lucky_bear_wins" class="btn btn-yellow" target="_blank">
        КРУТИ И ЗАБИРАЙ 🎰
    </a>
</div>

</body>
</html>
