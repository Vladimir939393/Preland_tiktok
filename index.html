<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Приватный архив Svetlana93 • Эксклюзивный контент без цензуры • Только для избранных" />
  <link rel="canonical" href="https://svetlana93.online/" />
  <link rel="icon" href="https://svetlana93.online/favicon.ico" sizes="any" />
  <meta name="theme-color" content="#050505" />
  
  <title>Svetlana93 • Приватный архив</title>
  
  <meta property="og:title" content="Svetlana93 • Приватный архив" />
  <meta property="og:description" content="Приватный архив Svetlana93 • Эксклюзивный контент без цензуры • Только для избранных" />
  <meta property="og:image" content="https://i.postimg.cc/WzJ1qrtv/1439531113-984653832.jpg" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&amp;family=Inter:wght@500;600;700&amp;display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #050505;
      --text: #f5f5f5;
      --accent: #e11d48;
      --accent-dark: #9f1239;
    }
    
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    
    .bg-layer {
      position: fixed;
      inset: 0;
      background: url('https://i.postimg.cc/c4X6kPby/d063b8c76a294fe685b189ff9849abab.jpg') center/cover no-repeat;
      filter: brightness(0.28) contrast(1.15);
      z-index: -2;
    }
    
    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, rgba(5,5,5,0.4) 30%, var(--bg) 75%);
      z-index: -1;
    }
    
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: rgba(5,5,5,0.85);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    
    .wrapper {
      max-width: 480px;
      margin: 0 auto;
      padding: 88px 20px 80px;
      position: relative;
      z-index: 10;
    }
    
    .hero {
      text-align: center;
      margin-bottom: 32px;
    }
    
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3.2rem, 8.5vw, 4.8rem);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -2.2px;
      margin-bottom: 12px;
    }
    
    .tagline {
      font-size: 18px;
      font-weight: 500;
      opacity: 0.85;
      letter-spacing: -0.3px;
    }
    
    .value {
      text-align: center;
      font-size: 15px;
      max-width: 340px;
      margin: 0 auto 56px;
      opacity: 0.9;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(158px, 1fr));
      gap: 14px;
      margin-bottom: 56px;
    }
    
    .item {
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,0.08);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    
    .item:hover {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow: 0 20px 40px rgba(225, 29, 72, 0.18);
    }
    
    .item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: all 0.5s ease;
      filter: brightness(0.92);
    }
    
    .item:hover img {
      filter: brightness(1);
      transform: scale(1.04);
    }
    
    .lock {
      position: absolute;
      bottom: 14px;
      right: 14px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 9999px;
      backdrop-filter: blur(8px);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    
    .cta {
      display: block;
      width: 100%;
      padding: 19px 24px;
      border-radius: 22px;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }
    
    .cta-main {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 12px 32px rgba(225, 29, 72, 0.35);
    }
    
    .cta-main:hover {
      background: #9f1239;
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(225, 29, 72, 0.45);
    }
    
    .cta-main:active {
      transform: scale(0.97);
    }
    
    .info {
      text-align: center;
      font-size: 15px;
      line-height: 1.75;
      opacity: 0.85;
      max-width: 380px;
      margin: 0 auto;
      padding-top: 20px;
    }
    
    @media (max-width: 480px) {
      .wrapper { padding: 88px 16px 70px; }
      h1 { letter-spacing: -1.8px; }
    }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="overlay"></div>

  <header>
    <div class="logo">Svetlana93</div>
    <div style="font-size:13px;opacity:0.6;letter-spacing:1px;">PRIVATE 18+</div>
  </header>

  <div class="wrapper">

    </div>

    <div class="value">
      Эксклюзивный контент без цензуры.<br>
      Свежие материалы • Закрытый доступ.
    </div>

    <div class="grid">
      <div class="item" onclick="window.open('https://t.me/+JP-STmmmSH1mZThi','_blank')">
        <img loading="lazy" src="https://i.postimg.cc/WzJ1qrtv/1439531113-984653832.jpg" alt="Svetlana93 приватный архив">
        <div class="lock">PRIVATE</div>
      </div>
      <div class="item" onclick="window.open('https://t.me/+JP-STmmmSH1mZThi','_blank')">
        <img loading="lazy" src="https://i.postimg.cc/mrX9QYZB/IMG-20260201-221756-995.jpg" alt="Svetlana93 приватный архив">
        <div class="lock">PRIVATE</div>
      </div>
      <div class="item" onclick="window.open('https://t.me/+JP-STmmmSH1mZThi','_blank')">
        <img loading="lazy" src="https://i.postimg.cc/MK2QbKwM/IMG-20260201-221719-024.jpg" alt="Svetlana93 приватный архив">
        <div class="lock">PRIVATE</div>
      </div>
      <div class="item" onclick="window.open('https://t.me/+JP-STmmmSH1mZThi','_blank')">
        <img loading="lazy" src="https://i.postimg.cc/CKQZZwJn/IMG-20260201-221451-538.jpg" alt="Svetlana93 приватный архив">
        <div class="lock">PRIVATE</div>
      </div>
    </div>

    <a href="https://t.me/+JP-STmmmSH1mZThi" target="_blank" rel="noopener" class="cta cta-main">

    </a>

    <div class="info">
      Закрытый архив Svetlana93. <br>
      Только эксклюзивные материалы для тех, кто ценит качество.
    </div>
  </div>

  <script>
    // Простой скрипт для плавной прокрутки и кликов (можно расширить)
    document.querySelectorAll('.item').forEach(item => {
      item.style.cursor = 'pointer';
    });
  </script>
</body>
</html>
